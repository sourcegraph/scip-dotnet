name: Test
on:
  push:
    branches:
      - main
  pull_request:
env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.x
            9.x
            10.x
      - run: dotnet format --verify-no-changes
      - run: dotnet format --verify-no-changes
        working-directory: snapshots/input/syntax
      - run: dotnet format --verify-no-changes
        working-directory: snapshots/input/syntax-slnx
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.x
            9.x
            10.x
      - run: dotnet test -p:TargetFrameworks=net10.0
      - run: dotnet test -p:TargetFrameworks=net9.0
      - run: dotnet test -p:TargetFrameworks=net8.0

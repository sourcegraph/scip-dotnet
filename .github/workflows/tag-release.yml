name: Tag release

# Tags a release when a version bump in ScipDotnet.csproj lands on main.
on:
  push:
    branches: ["main"]
    paths: ["ScipDotnet/ScipDotnet.csproj"]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag release
        id: tag
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's|.*<Version>([^<]*)</Version>.*|\1|p' ScipDotnet/ScipDotnet.csproj)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' in ScipDotnet.csproj is not of the form M.N.P"
            exit 1
          fi
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # A rerun of this workflow finds its own tag; publish again.
            # Other csproj changes, such as dependency updates, find an older tag.
            if [ "$(git rev-parse "$TAG^{commit}")" != "$GITHUB_SHA" ]; then
              echo "$TAG already exists on an earlier commit; nothing to release"
              exit 0
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Version $VERSION" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"

  # Tags pushed with GITHUB_TOKEN don't trigger workflows,
  # so start the publish workflow for the tag explicitly.
  dispatch:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Start publish.yml
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh workflow run publish.yml -R "$GITHUB_REPOSITORY" --ref "$TAG"
